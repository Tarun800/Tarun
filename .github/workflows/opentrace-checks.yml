name: OpenTrace checks
on:
  push:
    paths:
      - "opentrace/**"
      - ".github/workflows/opentrace-checks.yml"
  pull_request:
    paths:
      - "opentrace/**"
      - ".github/workflows/opentrace-checks.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opentrace
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check app.js && node --check utils.js
      - name: Run unit tests
        run: node --test
